services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: eventmanagement-backend
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_ASSUME_SSL: "false"
      RAILS_FORCE_SSL: "false"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: eventmanagement-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
